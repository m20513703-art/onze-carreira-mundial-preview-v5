function teamsForDivision(d){if(G.futureRosters&&G.futureRosters[d])return G.futureRosters[d].slice();let c=countries.find(x=>x.name===G.country.name);if(!c)return[];if(c.name==='Brasil')return G.track==='national'?(c.national[d]||[]).slice():((c.states[G.state]||{})[d]||[]).slice();return ((c.divisions||{})[d]||[]).slice()}
function swapRows(a,b,outA,outB){let na=Math.min(4,outA.length,outB.length),ra=a.slice(),rb=b.slice();for(let i=0;i<na;i++){let ia=outA[i].idx,ib=outB[outB.length-1-i].idx;ra[ia]=outB[outB.length-1-i].name;rb[ib]=outA[i].name}return[ra,rb]}
function simulateTable(names,season,division){let t=initialTable(names);for(let r=1;r<=7;r++)for(let [h,a] of roundFixtures(names,r)){let [hg,ag]=scoreFor(h,a,r,season+division);updateRow(t,h,a,hg,ag)}return t}
function acceptOffer(choice){G.offerChoice=choice;if(choice==='accept'&&G.offer){G.club=G.offer;G.log.unshift(`${G.player} aceitou a proposta de ${G.offer}.`)}else if(G.offer)G.log.unshift(`${G.player} recusou a proposta de ${G.offer}.`);save();render()}
function nextSeason(){if(!G.finished)return;let moved=G.movement;if(moved&&G.nextDivision){G.division=G.nextDivision;G.teams=teamsForDivision(G.nextDivision);G.league=G.division}
G.season++;G.round=1;G.table=initialTable(G.teams);G.finished=false;G.finishRank=0;G.promotion='';G.offer=null;G.offerChoice='';G.playedIds=[];G.lastResult='';G.energy=Math.min(100,G.energy+25);G.futureRosters=G.futureRosters||{};G.log.unshift(`Temporada ${G.season}: ${G.club} disputa ${G.division}.`);save();render()}
function startRound(){if(G.finished)return;let f=roundFixtures(G.teams,G.round).find(x=>x.includes(G.club));if(!f){G.round++;return startRound()}let opponent=f.find(x=>x!==G.club);match={opponent,home:f[0]===G.club,step:0,goals:0,actions:[]};tab='Partida';render()}
function takeAction(action){if(!match)return;let base=action==='dribble'?G.skill:action==='pass'?G.pass:G.skill;let success=((base*13+G.energy*7+match.step*29+G.season*11+match.opponent.length*3)%100)>36;match.actions.push({action,success});if(action==='shot'&&success)match.goals++;if(action==='pass'&&success)G.assists++;match.step++;if(match.step>=4)endMatch();else render()}
function endMatch(){let m=match;let hg=m.goals+(m.home?0:0),ag=Math.max(0,((m.opponent.length+m.step+G.round*3+G.season)%3));if(m.home){hg=m.goals}else {ag=m.goals;hg=Math.max(0,((G.club.length+G.round+m.step)%3))}let homeName=m.home?G.club:m.opponent,awayName=m.home?m.opponent:G.club;updateRow(G.table,homeName,awayName,hg,ag);G.apps++;G.energy=Math.max(0,G.energy-12);G.lastResult=`${homeName} ${hg}–${ag} ${awayName}`;G.playedIds.push(G.round);G.round++;if(G.apps>=5&&G.skill>=65&&!G.callup){G.callup=true;G.log.unshift(`Convocado para a seleção de ${G.country.name}!`)}if(G.round>7)seasonFinish();match=null;tab='Carreira';save();render()}
function renderMatch(){nav.innerHTML='';let step=match.step,acts=['pass','dribble','shot','shot'];app.innerHTML=`<header class="header"><div><div class="logo">DIA DE JOGO</div><div class="mini">${esc(G.club)} × ${esc(match.opponent)} · LANCE ${step+1}/4</div></div><span class="badge">${G.energy}% ⚡</span></header><section class="card"><div class="fixture"><div class="club"><div class="crest">${esc(G.club.slice(0,2).toUpperCase())}</div>${esc(match.home?G.club:match.opponent)}</div><div class="vs">⚽<br>VS</div><div class="club"><div class="crest away">${esc((match.home?match.opponent:G.club).slice(0,2).toUpperCase())}</div>${esc(match.home?match.opponent:G.club)}</div></div><div class="meta"><span>MINUTO ${[18,36,59,78][step]}'</span><span>PARTIDA ${G.round}/7</span></div></section><section class="field"><canvas id="pitch" width="420" height="380"></canvas></section><div class="msg" id="msg">${step===0?'Seu time recuperou a bola. Escolha o próximo lance.':'A jogada continua — faça sua escolha.'}</div><div class="tiles"><button class="btn" data-act="pass">TOCAR</button><button class="btn" data-act="dribble">DRIBLAR</button><button class="btn" data-act="shot">CHUTAR</button></div><button class="btn secondary" id="forfeit">SAIR DA PARTIDA</button><div class="footer">Toque numa ação para resolver o lance. Resultados demonstrativos.</div>`;drawPitch();app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>takeAction(b.dataset.act));$('#forfeit').onclick=()=>{match=null;tab='Carreira';render()}}
function drawPitch(){let cv=$('#pitch'),c=cv.getContext('2d');c.fillStyle='#206543';c.fillRect(0,0,420,380);for(let y=0;y<380;y+=63){c.fillStyle=(y/63)%2?'#246e49':'#1f6343';c.fillRect(0,y,420,63)}c.strokeStyle='#d7e9d8';c.lineWidth=2;c.strokeRect(12,12,396,356);c.beginPath();c.moveTo(12,190);c.lineTo(408,190);c.stroke();c.beginPath();c.arc(210,190,44,0,7);c.stroke();c.strokeRect(110,12,200,74);for(let i=0;i<5;i++){let x=95+i*55,y=270-(i%2)*45;c.fillStyle=i===2?'#c9f36a':'#f4f6e9';c.beginPath();c.arc(x,y,12,0,7);c.fill()}c.fillStyle='#fff';c.beginPath();c.arc(210,235,8,0,7);c.fill()}
function renderCareer(){nav.innerHTML=['Carreira','Liga','Perfil'].map((x,i)=>`<button class="${tab===x?'active':''}" data-tab="${x}"><span>${['⌂','▤','◉'][i]}</span>${x.toUpperCase()}</button>`).join('');nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let r=rank(G.table,G.club),op=G.finished?null:(roundFixtures(G.teams,G.round).find(x=>x.includes(G.club))||[]).find(x=>x!==G.club);let end=G.finished;app.innerHTML=`<header class="header"><div><div class="logo">ONZE / SUA CARREIRA</div><div class="mini">${esc(G.country.name)} · ${esc(G.division)} · TEMPORADA ${G.season}</div></div><span class="badge">${G.country.flag} R${Math.min(G.round,7)}/7</span></header><section class="card hero"><div class="eyebrow">${esc(G.position.toUpperCase())}${G.callup?' · 🇧🇷 SELEÇÃO':''}</div><h1>${esc(G.player)}</h1><div class="sub">${esc(G.club)} · ${esc(G.league)}</div><div class="chips"><span class="chip">⚡ Energia <strong>${G.energy}%</strong></span><span class="chip">🎯 Habilidade <strong>${G.skill}</strong></span><span class="chip">⚽ Gols <strong>${G.goals}</strong></span></div><div class="bar"><i style="width:${G.energy}%"></i></div></section>${end?`<section class="card"><div class="eyebrow">FIM DA TEMPORADA ${G.season}</div><p class="notice">${esc(G.promotion)}<br>Posição final: ${G.finishRank}º de ${G.teams.length}.</p>${G.offer?`<div class="tile"><b>📨 Proposta de transferência</b><p>${esc(G.offer)} quer contratar você para a próxima temporada.</p>${G.offerChoice?`<p>${G.offerChoice==='accept'?'Você aceitou a proposta.':'Você recusou a proposta.'}</p>`:`<div class="actions"><button class="btn" id="yes">ACEITAR</button><button class="btn secondary" id="no">RECUSAR</button></div>`}</div>`:''}<button class="btn" id="next">COMEÇAR PRÓXIMA TEMPORADA →</button></section>`:`<section class="card"><div class="eyebrow">PRÓXIMO JOGO · RODADA ${G.round}</div><div class="fixture"><div class="club"><div class="crest">${esc(G.club.slice(0,2).toUpperCase())}</div>${esc(G.club)}<small>VOCÊ</small></div><div class="vs">VS</div><div class="club"><div class="crest away">${esc((op||'—').slice(0,2).toUpperCase())}</div>${esc(op||'—')}<small>ADVERSÁRIO</small></div></div><button class="btn" id="play">JOGAR PARTIDA</button><button class="btn secondary" id="train">TREINAR +1</button><button class="btn secondary" id="rest">DESCANSAR +25 ENERGIA</button></section>`}<div class="title"><b>TABELA · ${esc(G.division)}</b><small>VITÓRIA 3 · EMPATE 1</small></div><section class="card">${tableHTML(G.table,G.club)}</section><section class="card"><div class="eyebrow">ÚLTIMAS NOTÍCIAS</div><p class="small">${esc(G.log[0]||'A temporada está em andamento.')}</p></section><div class="footer">Clubes e divisões conforme as listas enviadas. Temporada de sete rodadas e resultados simulados. Na virada, os quatro primeiros e os quatro últimos trocam de divisão somente onde há listas adjacentes. Times fictícios? Não: não foram adicionados a lista. Sem licença oficial. Salvamento independente no aparelho.</div>`;$('#play')?.addEventListener('click',startRound);$('#train')?.addEventListener('click',()=>{G.skill=Math.min(99,G.skill+1);G.energy=Math.max(0,G.energy-14);record('Treino concluído: habilidade +1.');render()});$('#rest')?.addEventListener('click',()=>{G.energy=Math.min(100,G.energy+25);record('Recuperação concluída.');render()});$('#yes')?.addEventListener('click',()=>acceptOffer('accept'));$('#no')?.addEventListener('click',()=>acceptOffer('reject'));$('#next')?.addEventListener('click',nextSeason)}
function renderLeague(){nav.innerHTML=['Carreira','Liga','Perfil'].map((x,i)=>`<button class="${tab===x?'active':''}" data-tab="${x}"><span>${['⌂','▤','◉'][i]}</span>${x.toUpperCase()}</button>`).join('');nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});app.innerHTML=`<header class="header"><div><div class="logo">ONZE / CLASSIFICAÇÃO</div><div class="mini">${esc(G.league)} · TEMPORADA ${G.season}</div></div></header><section class="card">${tableHTML(G.table,G.club)}</section><button class="btn secondary" id="back">VOLTAR À CARREIRA</button>`;$('#back').onclick=()=>{tab='Carreira';render()}}
function renderProfile(){nav.innerHTML=['Carreira','Liga','Perfil'].map((x,i)=>`<button class="${tab===x?'active':''}" data-tab="${x}"><span>${['⌂','▤','◉'][i]}</span>${x.toUpperCase()}</button>`).join('');nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});app.innerHTML=`<header class="header"><div><div class="logo">ONZE / PERFIL</div><div class="mini">HISTÓRICO DA CARREIRA</div></div></header><section class="card"><h1>${esc(G.player)}</h1><p>${esc(G.position)} · ${esc(G.club)} · ${esc(G.country.name)}</p><div class="stats"><div class="stat"><b>${G.apps}</b><small>PARTIDAS</small></div><div class="stat"><b>${G.goals}</b><small>GOLS</small></div><div class="stat"><b>${G.callup?'SIM':'—'}</b><small>SELEÇÃO</small></div></div>${G.log.map(x=>`<p class="small">${esc(x)}</p>`).join('')}</section><button id="newCareer" class="btn secondary">COMEÇAR OUTRA CARREIRA</button><div class="footer">Outra carreira inicia um novo save independente; a antiga permanece salva neste aparelho.</div>`;$('#newCareer').onclick=()=>{G=null;match=null;tab='Carreira';renderSetup()}}
function render(){if(!G){renderSetup();return}if(tab==='Partida'&&match){renderMatch();return}if(tab==='Liga'){renderLeague();return}if(tab==='Perfil'){renderProfile();return}renderCareer()}
init();
</script></body></html>
